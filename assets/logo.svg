<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e3c76c"/>
      <stop offset="100%" stop-color="#c9a64a"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b3b60"/>
      <stop offset="100%" stop-color="#062d4b"/>
    </linearGradient>
  </defs>
  
  <!-- Icon Symbol: Stylized Orthodontic Tooth & Alignment Curve -->
  <g transform="translate(15, 10)">
    <!-- Outer Shield / Circle with gold border -->
    <rect x="0" y="0" width="60" height="60" rx="18" fill="url(#navyGrad)" />
    <!-- Golden orthodontic arch wire -->
    <path d="M12 40 C18 20, 42 20, 48 40" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <!-- Brackets -->
    <rect x="18" y="27" width="5" height="5" rx="1.5" fill="#ffffff" />
    <rect x="27.5" y="23" width="5" height="5" rx="1.5" fill="url(#goldGrad)" />
    <rect x="37" y="27" width="5" height="5" rx="1.5" fill="#ffffff" />
    <!-- Center sparkle / star -->
    <path d="M30 14 L31.5 17.5 L35 19 L31.5 20.5 L30 24 L28.5 20.5 L25 19 L28.5 17.5 Z" fill="url(#goldGrad)" />
    <circle cx="16" cy="42" r="2.5" fill="url(#goldGrad)"/>
    <circle cx="44" cy="42" r="2.5" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography (Persian) -->
  <g transform="translate(90, 20)">
    <text x="210" y="23" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="21" font-weight="900" fill="#0b3b60" text-anchor="end">دکتر سعید قریشی</text>
    <text x="210" y="44" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="11.5" font-weight="600" fill="#c9a64a" text-anchor="end">متخصص ارتودنسی و ناهنجاری‌های فکی</text>
  </g>
</svg>
