<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 65" fill="none">
  <!-- Tooth Icon Symbol -->
  <g transform="translate(10, 4)">
    <!-- Dark navy tooth crown and root contours -->
    <path
      d="M 21 12 C 14 9 7 16 7 24 C 7 32 11 38 13 47 C 15 52 17 56 19 56 C 21 56 23 47 26 39 C 28 33 32 33 34 39 C 37 47 39 56 41 56 C 43 56 45 52 47 47 C 49 38 53 32 53 24 C 53 16 46 9 39 12 C 34 13.5 32 17 30 17 C 28 17 26 13.5 21 12 Z"
      stroke="#0b3b60"
      stroke-width="3.2"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <!-- Golden intersecting orthodontic alignment arch -->
    <path
      d="M 5 36 C 11 44 20 49 30 49 C 40 49 49 44 55 36"
      stroke="#eab643"
      stroke-width="3.2"
      stroke-linecap="round"
      fill="none"
    />
    <path
      d="M 6 36 C 12 28 20 25 30 25 C 40 25 48 28 54 36"
      stroke="#eab643"
      stroke-width="2.4"
      stroke-linecap="round"
      fill="none"
    />
  </g>

  <!-- Typography -->
  <g transform="translate(75, 6)">
    <text x="0" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#0b3b60" letter-spacing="-0.3">Dr. Ghorashi</text>
    <text x="0" y="34" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="15" font-weight="800" fill="#0b3b60">دکتر سعید قریشی</text>
    <text x="0" y="48" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="10" font-weight="600" fill="#1e4767">متخصص ارتودنسی و ناهنجاری‌های فکی</text>
  </g>
</svg>
